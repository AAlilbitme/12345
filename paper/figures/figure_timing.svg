<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="620" viewBox="0 0 1260 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c62828"/></marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#ef9a9a" stroke-width="2"/></pattern>
  </defs>

  <rect x="0" y="0" width="1260" height="620" fill="#ffffff"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#222">Staggered CLTV timelocks — timing safety  (block height &#8594;)</text>
  <text x="40" y="62" font-size="12.5" fill="#777">covers cltv_blocks.spthy · gaps.spthy · t2b_attack.spthy — see rail →</text>

  <!-- Δ shading between deadlines -->
  <rect x="350" y="130" width="200" height="210" fill="#2e7d32" opacity="0.06"/>
  <rect x="550" y="130" width="200" height="210" fill="#2e7d32" opacity="0.06"/>

  <!-- hop lanes -->
  <g font-size="12" font-weight="600" fill="#37474f" text-anchor="end">
    <text x="118" y="169">Carol→Dave</text>
    <text x="118" y="234">Bob→Carol</text>
    <text x="118" y="299">Alice→Bob</text>
  </g>

  <!-- redeem windows (green) + refund zones (hatched) -->
  <rect x="130" y="150" width="220" height="26" rx="4" fill="#2e7d32" opacity="0.30"/>
  <rect x="350" y="150" width="530" height="26" fill="url(#hatch)" opacity="0.5"/>
  <rect x="130" y="215" width="420" height="26" rx="4" fill="#2e7d32" opacity="0.30"/>
  <rect x="550" y="215" width="330" height="26" fill="url(#hatch)" opacity="0.5"/>
  <rect x="130" y="280" width="620" height="26" rx="4" fill="#2e7d32" opacity="0.30"/>
  <rect x="750" y="280" width="130" height="26" fill="url(#hatch)" opacity="0.5"/>

  <text x="230" y="167" font-size="11" fill="#1b5e20" text-anchor="middle">redeem window</text>
  <text x="330" y="234" font-size="11" fill="#1b5e20" text-anchor="middle">redeem window</text>
  <text x="420" y="299" font-size="11" fill="#1b5e20" text-anchor="middle">redeem window</text>

  <!-- deadline verticals -->
  <g stroke="#c62828" stroke-width="1.3" stroke-dasharray="4,3">
    <line x1="350" y1="140" x2="350" y2="330"/>
    <line x1="550" y1="140" x2="550" y2="330"/>
    <line x1="750" y1="140" x2="750" y2="330"/>
  </g>

  <!-- backward preimage propagation -->
  <text x="352" y="132" font-size="11.5" font-weight="700" fill="#2e7d32">Dave reveals x</text>
  <path d="M350,163 C 430,120 470,190 548,228" fill="none" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#ag)"/>
  <path d="M550,228 C 630,185 670,255 748,293" fill="none" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="450" y="200" font-size="10.5" fill="#2e7d32" text-anchor="middle">Carol redeems</text>
  <text x="450" y="212" font-size="10.5" fill="#2e7d32" text-anchor="middle">before 2t</text>
  <text x="650" y="265" font-size="10.5" fill="#2e7d32" text-anchor="middle">Bob redeems</text>
  <text x="650" y="277" font-size="10.5" fill="#2e7d32" text-anchor="middle">before 3t</text>

  <!-- Δ braces -->
  <text x="450" y="125" font-size="11" fill="#33691e" text-anchor="middle">Δ margin</text>
  <text x="650" y="125" font-size="11" fill="#33691e" text-anchor="middle">Δ margin</text>

  <!-- anchors -->
  <circle cx="450" cy="345" r="11" fill="#2e7d32"/><text x="450" y="349" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <circle cx="230" cy="345" r="11" fill="#2e7d32"/><text x="230" y="349" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>

  <!-- axis -->
  <line x1="130" y1="380" x2="890" y2="380" stroke="#555" stroke-width="1.5" marker-end="url(#ag)"/>
  <g font-size="12" fill="#c62828" text-anchor="middle" font-weight="600">
    <line x1="350" y1="374" x2="350" y2="386" stroke="#c62828"/><text x="350" y="400">t  (C→D deadline)</text>
    <line x1="550" y1="374" x2="550" y2="386" stroke="#c62828"/><text x="550" y="400">2t (B→C)</text>
    <line x1="750" y1="374" x2="750" y2="386" stroke="#c62828"/><text x="750" y="400">3t (A→B)</text>
  </g>
  <text x="895" y="384" font-size="11" fill="#555">block height</text>
  <text x="130" y="400" font-size="11" fill="#33691e">the CLTV-delta invariant: d_out &lt; d_in  (each inbound deadline is later)</text>

  <!-- RACE strip (red) -->
  <line x1="40" y1="430" x2="895" y2="430" stroke="#eee"/>
  <circle cx="60" cy="462" r="11" fill="#c62828"/><text x="60" y="466" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="82" y="458" font-size="13" font-weight="700" fill="#c62828">WITHOUT the liveness assumption T2b  (t2b_attack.spthy)</text>
  <text x="82" y="476" font-size="11.5" fill="#c62828">adversary fires the A→B inbound timeout early → Bob's outbound is redeemed but his inbound refunds → Bob loses.</text>
  <rect x="130" y="492" width="360" height="20" rx="3" fill="#2e7d32" opacity="0.25"/>
  <text x="310" y="506" font-size="10.5" fill="#1b5e20" text-anchor="middle">Bob's outbound redeemed (paid out)</text>
  <rect x="130" y="516" width="230" height="20" fill="url(#hatch)" opacity="0.6"/>
  <line x1="360" y1="486" x2="360" y2="542" stroke="#c62828" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="365" y="530" font-size="10.5" fill="#c62828">inbound timed out EARLY → Bob refunds inbound = net loss</text>
  <text x="130" y="558" font-size="11" fill="#555">Two-sided certificate: race reachable here (T2b removed) ↔ blocked in multihop.spthy (T2b_Counterexample_Blocked). So T2b is load-bearing.</text>

  <!-- ============ RAIL ============ -->
  <line x1="915" y1="110" x2="915" y2="580" stroke="#ddd"/>
  <text x="935" y="120" font-size="14" font-weight="700" fill="#222">LEMMAS · timing theories</text>

  <g font-size="10.5">
    <circle cx="944" cy="150" r="9" fill="#2e7d32"/><text x="944" y="153.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="962" y="147" font-weight="700" fill="#2e7d32">cltv_blocks.spthy — windows EXIST</text>
    <text x="962" y="161" fill="#444">CLTV_Gap_Is_Positive ✓ · Claim_Window_Nonempty ✓</text>
    <text x="962" y="173" fill="#444">Staggered_Path_Safe ✓  (derives d_out &lt; d_in from block nums)</text>

    <circle cx="944" cy="205" r="9" fill="#2e7d32"/><text x="944" y="208.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="962" y="202" font-weight="700" fill="#2e7d32">gaps.spthy — claim-in-time + lifecycle</text>
    <text x="962" y="216" fill="#444">Claim_Window_Exists ✓ · Outcome_Exclusive ✓</text>
    <text x="962" y="228" fill="#444">Transitive_Preimage_Before_Upstream_Deadline ✓</text>
    <text x="962" y="240" fill="#444">No_HTLC_After_Close ✓ · Redeem_Reachable / Refund_Reachable ✓</text>

    <circle cx="944" cy="272" r="9" fill="#c62828"/><text x="944" y="275.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="962" y="269" font-weight="700" fill="#c62828">t2b_attack.spthy — the race (T2b removed)</text>
    <text x="962" y="283" fill="#444">Early_Timeout_Race ✓  (reachable without T2b)</text>
    <text x="962" y="295" fill="#666">pairs with multihop's T2b_Counterexample_Blocked ✓</text>
    <text x="962" y="307" fill="#666">→ together: proof that T2b is necessary, not assumed away</text>
  </g>

  <line x1="935" y1="330" x2="1240" y2="330" stroke="#eee"/>
  <text x="935" y="350" font-size="10.5" fill="#777">green = timing safety proved · red = the race,</text>
  <text x="935" y="365" font-size="10.5" fill="#777">shown reachable to justify the assumption.</text>
  <text x="935" y="387" font-size="10.5" fill="#777" font-style="italic">cltv_blocks proves that the assumed deadline stagger leaves a claim window;</text>
  <text x="935" y="402" font-size="10.5" fill="#777" font-style="italic">gaps adds the block-clock lifecycle safety.</text>

  <text x="470" y="600" font-size="11.5" fill="#888" text-anchor="middle">Timing results live in separate abstractions; online claiming remains an explicit liveness assumption.</text>
</svg>
